<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Programming Advices - DVLD Project</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #0a0f14;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
        position: relative;
      }

      #topoCanvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        /* Half-resolution rendering for performance */
        image-rendering: auto;
      }

      .card {
        position: relative;
        z-index: 10;
        background: rgba(13, 17, 23, 0.94);
        border: 1px solid rgba(0, 255, 255, 0.25);
        border-radius: 16px;
        padding: 60px 80px;
        text-align: center;
        backdrop-filter: blur(6px);
        box-shadow:
          0 0 60px rgba(0, 255, 255, 0.08),
          inset 0 0 60px rgba(0, 255, 255, 0.02);
        animation: cardFloat 6s ease-in-out infinite;
      }

      @keyframes cardFloat {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      .title-main {
        font-size: 52px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: 4px;
        text-transform: uppercase;
        line-height: 1.1;
        text-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
      }

      .title-accent {
        font-size: 52px;
        font-weight: 800;
        color: #00e5ff;
        letter-spacing: 4px;
        text-transform: uppercase;
        line-height: 1.1;
        margin-top: 4px;
        text-shadow: 0 0 40px rgba(0, 229, 255, 0.4);
        animation: accentPulse 3s ease-in-out infinite;
      }

      @keyframes accentPulse {
        0%,
        100% {
          text-shadow: 0 0 40px rgba(0, 229, 255, 0.4);
        }
        50% {
          text-shadow: 0 0 60px rgba(0, 229, 255, 0.7);
        }
      }

      .subtitle {
        font-size: 16px;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.7);
        letter-spacing: 6px;
        text-transform: uppercase;
        margin-top: 20px;
      }

      .divider {
        width: 100%;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(0, 255, 255, 0.3) 20%,
          rgba(0, 255, 255, 1) 50%,
          rgba(0, 255, 255, 0.3) 80%,
          transparent
        );
        margin: 28px 0;
        animation: dividerGlow 2s ease-in-out infinite;
      }

      @keyframes dividerGlow {
        0%,
        100% {
          opacity: 0.8;
          box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }
        50% {
          opacity: 1;
          box-shadow: 0 0 25px rgba(0, 255, 255, 0.6);
        }
      }

      .project-name {
        font-size: 18px;
        font-weight: 300;
        color: rgba(255, 255, 255, 0.85);
        letter-spacing: 1px;
      }

      @media (max-width: 768px) {
        .card {
          padding: 40px 28px;
          margin: 16px;
        }
        .title-main,
        .title-accent {
          font-size: 30px;
          letter-spacing: 2px;
        }
        .subtitle {
          font-size: 12px;
          letter-spacing: 3px;
        }
        .project-name {
          font-size: 14px;
        }
      }
    </style>
    <base target="_blank" />
  </head>
  <body>
    <canvas id="topoCanvas"></canvas>

    <div class="card">
      <div class="title-main">PROGRAMMING</div>
      <div class="title-accent">ADVICES</div>
      <div class="subtitle">LEARN THE RIGHT WAY</div>
      <div class="divider"></div>
      <div class="project-name">
        Driver & Vehicle Licenses Department (DVLD) Project
      </div>
    </div>

    <script>
      // ============================================
      // ORIGINAL-STYLE ANIMATED CONTOUR LINES
      // Same look, but half-resolution canvas + 30fps
      // ============================================

      const canvas = document.getElementById("topoCanvas");
      const ctx = canvas.getContext("2d");

      let W,
        H,
        time = 0;
      let mouseX = 0,
        mouseY = 0,
        targetMX = 0,
        targetMY = 0;
      const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
      const SCALE = 0.6; // Render at 60% resolution = ~64% fewer pixels

      // Original noise function (3 sin/cos waves)
      function noise(x, y, t) {
        return (
          Math.sin(x * 0.008 + t * 0.3) * Math.cos(y * 0.006 + t * 0.2) +
          Math.sin(x * 0.015 + y * 0.012 + t * 0.15) * 0.5 +
          Math.cos(x * 0.005 - y * 0.008 + t * 0.25) * 0.3
        );
      }

      function resize() {
        const cssW = window.innerWidth;
        const cssH = window.innerHeight;
        // Canvas internal resolution = CSS size * SCALE (lower = faster)
        W = canvas.width = Math.floor(cssW * SCALE);
        H = canvas.height = Math.floor(cssH * SCALE);
        // CSS display size stays full
        canvas.style.width = cssW + "px";
        canvas.style.height = cssH + "px";
      }
      window.addEventListener("resize", resize);
      resize();

      document.addEventListener("mousemove", (e) => {
        targetMX = e.clientX * SCALE;
        targetMY = e.clientY * SCALE;
      });

      function draw() {
        ctx.clearRect(0, 0, W, H);

        // Smooth mouse follow
        mouseX += (targetMX - mouseX) * 0.03;
        mouseY += (targetMY - mouseY) * 0.03;

        const numLines = 70; // Original: 80
        const mouseRange = 120;
        const step = Math.max(3, Math.floor(5 * SCALE)); // fewer points at lower res

        for (let i = 0; i < numLines; i++) {
          const baseY = (i / numLines) * H * 1.4 - H * 0.2;
          const distFromMouse = Math.abs(baseY - mouseY);
          const mouseGlow = Math.max(0, 1 - distFromMouse / 400);
          const baseOpacity = 0.15 + Math.sin(i * 0.3 + time * 0.5) * 0.08;
          const opacity = baseOpacity + mouseGlow * 0.35;

          ctx.beginPath();
          ctx.strokeStyle = `rgba(0, ${(200 + mouseGlow * 55) | 0}, ${(220 + mouseGlow * 35) | 0}, ${opacity})`;
          ctx.lineWidth = (0.8 + mouseGlow * 1.5) * SCALE;

          let firstPoint = true;
          for (let x = 0; x <= W; x += step) {
            let yOffset = noise(x, baseY, time) * 80;

            const dx = x - mouseX;
            const dy = baseY - mouseY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < mouseRange * 3) {
              const force = (1 - dist / (mouseRange * 3)) * mouseRange;
              yOffset += (dy / (dist || 1)) * force * 0.5;
            }

            const y = baseY + yOffset;
            if (firstPoint) {
              ctx.moveTo(x, y);
              firstPoint = false;
            } else {
              ctx.lineTo(x, y);
            }
          }
          ctx.stroke();
        }

        // Closed contour loops (islands) — original: 15
        const numIslands = 12;
        for (let i = 0; i < numIslands; i++) {
          const cx = (Math.sin(i * 2.5 + time * 0.1) * 0.4 + 0.5) * W;
          const cy = (Math.cos(i * 1.8 + time * 0.08) * 0.4 + 0.5) * H;
          const radius = 30 + Math.sin(i + time * 0.2) * 15 + i * 8;
          const distFromMouse = Math.sqrt(
            (cx - mouseX) ** 2 + (cy - mouseY) ** 2,
          );
          const mouseGlow = Math.max(0, 1 - distFromMouse / 300);

          ctx.beginPath();
          ctx.strokeStyle = `rgba(0, ${(200 + mouseGlow * 55) | 0}, ${(220 + mouseGlow * 35) | 0}, ${0.1 + mouseGlow * 0.3})`;
          ctx.lineWidth = (0.6 + mouseGlow) * SCALE;

          for (let a = 0; a <= Math.PI * 2; a += 0.06) {
            const r =
              radius +
              Math.sin(a * 3 + time * 0.4 + i) * 10 +
              Math.cos(a * 5 - time * 0.3 + i * 2) * 5;
            const x = cx + Math.cos(a) * r;
            const y = cy + Math.sin(a) * r;
            if (a === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.stroke();
        }
      }

      // 30 FPS cap
      let lastTime = 0;
      const frameInterval = 1000 / 30;

      function animate(now) {
        requestAnimationFrame(animate);
        const delta = now - lastTime;
        if (delta < frameInterval) return;
        lastTime = now - (delta % frameInterval);

        time += 0.016;
        draw();
      }

      requestAnimationFrame(animate);
    </script>
  </body>
</html>

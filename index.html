<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>اختبار API</title>
<style>
  body { font-family: sans-serif; padding: 40px; background: #1e1e1e; color: #eee; }
  button { padding: 12px 24px; font-size: 16px; cursor: pointer; }
  #result { margin-top: 20px; white-space: pre-wrap; background: #111; padding: 15px; border-radius: 6px; }
</style>

<body>

<h2>اختبار الاتصال بـ API</h2>
<button onclick="testLogin()">اضغط لتجربة تسجيل الدخول</button>
<div id="result">النتيجة هتظهر هنا وفي الـ Console (F12)</div>

<script>
  const credentials = {
    username: "Adnan",
    password: "12"
  };
  async function testLogin() {
    const url = `https://idnan820-001-site1.ltempurl.com/api/Users/login?username=${credentials.username}&password=${credentials.password}`;
    console.log("جاري إرسال الطلب إلى:", url);
    document.getElementById("result").textContent = "جاري الإرسال...";

    try {
      const response = await fetch(url);
      console.log("Status Code:", response.status);

      const data = await response.json().catch(() => null);
      console.log("Response Data:", data);

      document.getElementById("result").textContent =
        "Status: " + response.status + "\n\n" + JSON.stringify(data, null, 2);
    } catch (error) {
      console.error("حصل خطأ أثناء الطلب:", error);
      document.getElementById("result").textContent = "خطأ: " + error.message;
    }
  }
</script>

</body>
</html>

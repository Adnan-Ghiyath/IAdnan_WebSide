<!doctype html>
<html lang="en">
  <head>
    <!-- ✅ Character encoding so text renders correctly -->
    <meta charset="utf-8" />

    <!-- ✅ Responsive page on mobile/tablet (scales correctly) -->
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <!-- ✅ Browser tab title -->
    <title>Weather App — Public API (Open-Meteo)</title>
    <link rel="stylesheet" href="Weather.css" />
  </head>

  <body>
    <!-- ✅ App wrapper for centering and layout -->
    <div class="app">
      <div class="card">
        <!-- ✅ Title + description -->
        <h1>Weather App (Public API)</h1>
        <div class="muted">
          Search any city → get current weather + 7-day forecast.
        </div>

        <!-- ✅ Search row: input + buttons -->
        <div class="row" style="margin-top: 12px">
          <input
            id="city"
            placeholder="Type a city… (e.g., Amman, London, Tokyo)"
          />
          <button id="btnSearch">Search</button>
          <button style="background-color: red" id="btnclear">Clear</button>
          <button id="btnUseDubai" class="secondary">Use Dubai</button>
        </div>

        <!-- ✅ Loading status (spinner + text) -->
        <div class="status muted" id="loading">
          <div class="spinner"></div>
          <div>Loading…</div>
        </div>

        <!-- ✅ Error message area -->
        <div class="error" id="error"></div>

        <!-- ✅ Results area (hidden until we have data) -->
        <div class="grid" id="results" style="display: none">
          <!-- ✅ Current weather card -->
          <div class="card">
            <strong id="placeName">—</strong>
            <div class="muted" id="placeMeta" style="margin-top: 6px">—</div>

            <div class="big" id="tempNow">—</div>

            <div>
              <span class="pill" id="humidityPill">Humidity: —</span>
              <span class="pill" id="windPill">Wind: —</span>
            </div>

            <div class="muted" id="timeMeta" style="margin-top: 10px">—</div>
          </div>

          <!-- ✅ 7-day forecast table card -->
          <div class="card">
            <strong>7-Day Forecast</strong>
            <!-- ✅ NEW: wrapper lets the table scroll sideways on very
                 narrow phones instead of squeezing or overflowing -->
            <div class="tableWrap">
              <table>
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Min</th>
                    <th>Max</th>
                    <th>Rain</th>
                  </tr>
                </thead>
                <tbody id="forecastBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="Weather.js"></script>
</html>

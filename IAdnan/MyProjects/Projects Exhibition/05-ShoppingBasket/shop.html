<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shop – IndexedDB Basket Demo</title>
    <link rel="stylesheet" href="shop.css" />
  </head>
  <body>
    <div class="page-shell">
      <!-- ======================================================
           ✅ HEADER (title + small description + badge)
           ====================================================== -->
      <div class="header">
        <div class="header-title">
          <h1>JavaScript Shop (IndexedDB)</h1>
          <p>
            Products stored in IndexedDB – basket persists while tab is open.
          </p>
        </div>
        <div class="badge">IndexedDB • Products Store + Cart Store</div>
      </div>

      <!-- ======================================================
           ✅ LEFT SIDE: PRODUCTS (cards rendered via JavaScript)
           ====================================================== -->
      <div class="products-panel">
        <div class="products-panel-header">
          <div class="section-title">🛍 Products</div>
          <button id="btn_Show" class="btn-add-product">
            ➕ Add your own product
          </button>
        </div>

        <div id="productsGrid" class="products-grid">
          <!-- ✅ Product cards will be inserted here via JS -->
        </div>
      </div>

      <!-- ======================================================
           ✅ RIGHT SIDE: CART / BASKET
           ====================================================== -->
      <div class="cart-panel">
        <div class="cart-card">
          <div class="section-title">🧺 Basket</div>

          <!-- ✅ List of items inside the basket -->
          <div id="cartItems" class="cart-items">
            <div id="cartEmpty" class="cart-empty">Your basket is empty.</div>
          </div>

          <!-- ✅ Total price -->
          <div class="cart-footer">
            <span class="total-label">Total:</span>
            <span id="cartTotal" class="total-value">$0.00</span>
          </div>

          <!-- ✅ Cart actions -->
          <div class="cart-actions">
            <button class="btn-danger" onclick="clearCart()">
              🗑 Clear Basket
            </button>
            <button onclick="goToCheckout()">Checkout →</button>
          </div>

          <!-- ✅ Status indicator (db opening / updated / errors) -->
          <div class="cart-status">
            <div id="statusDot" class="status-dot dot-wait"></div>
            <span id="statusText">Opening database...</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ======================================================
         ✅ ADD PRODUCT MODAL
         ====================================================== -->
    <div class="modal-overlay" id="modal">
      <div class="modal-box">
        <div class="modal-header">
          <h2>Add a new product</h2>
          <button class="modal-close" id="closeBtnX" aria-label="Close">
            ✕
          </button>
        </div>

        <div class="modal-body">
          <label class="modal-label" for="Name-input">Name</label>
          <input
            id="Name-input"
            class="modal-input"
            type="text"
            placeholder="e.g. Gold Necklace"
          />

          <label class="modal-label" for="description-input">Description</label>
          <input
            id="description-input"
            class="modal-input"
            type="text"
            placeholder="Short description"
          />

          <label class="modal-label" for="Img-input">Image URL</label>
          <input
            id="Img-input"
            class="modal-input"
            type="text"
            placeholder="https://..."
          />

          <label class="modal-label" for="price-input">Price</label>
          <input
            id="price-input"
            class="modal-input"
            type="text"
            placeholder="0.00"
          />
        </div>

        <div class="actions">
          <button class="btn-secondary" id="closeBtn">إلغاء</button>
          <button id="MySaveButtion">حفظ</button>
        </div>
      </div>
    </div>
  </body>

  <script src="shop.js"></script>
</html>
